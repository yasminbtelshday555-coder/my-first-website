<!DOCTYPE html>
<html>
<head>
   
    <title>האתר הראשון שלי</title>

    <style>
body {
    background-color: lightblue;

    text-align: center;
}

.card {
    background-color: white;
    padding: 30px;
    border-radius: 20px;
    width: 400px;
    margin: 50px auto;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    border: 2px solid purple;
}

h1 {
    color: purple;
    font-size: 40px;
}

button {
    background-color: purple;
    color: white;
    font-size: 20px;
    padding: 10px 20px;
}

button:hover {
    background-color: pink;
    transform: scale(1.05);
    transition: 0.2s;
}

img {
    width: 350px;
    border-radius: 50%;

    @media (max-width: 600px) {
    .card {
        width: 80%;
    }
}
}
    </style>

</head>
<body>

    <div class="card"></div>

    <h1>שלום! 👋</h1>

    <p>זה האתר הראשון שאני בונה.</p>

    <img src="https://picsum.photos/300" alt="תמונה לדוגמה">

    <button onclick="sayHello()">לחצי כאן</button>

    </div>

</body>

<script>
function sayHello() {
    alert("🎉  שלום! שמי יסמין ואני לומדת לתכנת!");
}
</script>

</html>
